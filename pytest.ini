[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html
    --maxfail=10

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gui: marks tests that need a display / PySide6
    db: marks tests that need database
    login: login workflow tests
    chat: send DM + AI reply workflow tests
    history: message history workflow tests

# Qt 配置（仅 .venv 有 PySide6 时使用）
# GUI 测试命令: .venv\Scripts\python.exe -m pytest tests/ -m "gui" --override-ini="qt_api=pyside6"
