# DMShoot 测试修正版 —— 用来替换原来的 test.yml + tests.yml
#
# 【原版两个致命问题】
#  1) 每一测试步都写了 continue-on-error: true / || true
#     -> 测试全崩也显示 "✓ 成功"，也就是"假绿"
#  2) ubuntu 上崩在 pytest 配置阶段（实测日志）：
#       pytestqt/plugin.py -> ImportError: libEGL.so.1: cannot open shared object file
#     pytest-qt 一启动就 import QtGui，Linux runner 缺 libEGL
#     -> pytest INTERNALERROR -> exit code 3，一个测试都没跑
#     -> 然后被 continue-on-error 吞掉，变成假绿
#
# 【本版修正】
#  - Linux 上装 Qt 运行库（libegl1 等），从根上补掉 libEGL.so.1
#  - 用 -p no:pytestqt 直接绕开那个崩溃点（CI 不跑 GUI 测试，不需要 qtbot）
#  - 去掉所有 continue-on-error，让失败真的变红
#  - 只跑 tests/ 目录（pytest.ini 的 testpaths，即不依赖 GUI 的那套）
#    根目录那 15 个 test_*.py 里有大量 GUI / 需要抖音 cookie / 需要真连的，
#    在无显示器无网络的 CI 里本来就不该跑
#  - 无论成败都产出 junit + html 报告
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 Qt 运行库（Linux，治 libEGL.so.1）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: 建报告目录
        shell: bash
        run: mkdir -p reports

      - name: 跑测试（不再吞错）
        # -p no:pytestqt 是关键：绕开 pytest-qt 在无显示器环境下的崩溃
        run: pytest tests/ -m "not gui" -p no:pytestqt --junitxml=reports/junit.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14
